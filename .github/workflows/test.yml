name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/test_extract.py
      - run: python scripts/test_mesher.py
      - run: python kicad_plugin/test_core.py
      - run: python kicad_plugin/build_pcm.py
